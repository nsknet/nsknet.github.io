name: Build frontend

# static/dist/ is committed so a VPS can `git clone` and run without Node.
# This keeps it in sync whenever the source changes.
on:
  push:
    branches: [main, dev]
    paths:
      - 'NsPanel/frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: write

# Two quick pushes must not race to commit two bundles; the newer run wins.
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NsPanel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NsPanel/frontend/package-lock.json
      - run: npm ci
      # Never commit a bundle built from code that fails its own checks.
      - run: npm run check
      - run: npm run build
      - name: Commit the rebuilt bundle
        working-directory: .
        run: |
          if [ -z "$(git status --porcelain NsPanel/static/dist)" ]; then
            echo "dist is already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NsPanel/static/dist
          git commit -m "build: rebuild frontend bundle [skip ci]"
          # Someone may have pushed while this ran; the bundle only touches
          # static/dist, so replaying it on top is safe.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt ${attempt} failed, retrying"
            sleep 5
          done
          exit 1
