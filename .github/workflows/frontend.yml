name: Build frontend

# static/dist/ is committed so a VPS can `git clone` and run without Node.
# This keeps it in sync whenever the source changes.
on:
  push:
    branches: [main, dev]
    paths:
      - 'NsPanel/frontend/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NsPanel/frontend/package-lock.json
      - run: npm ci
        working-directory: NsPanel/frontend
      - run: npm run build
        working-directory: NsPanel/frontend
      - name: Commit the rebuilt bundle
        run: |
          if [ -z "$(git status --porcelain NsPanel/static/dist)" ]; then
            echo "dist is already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NsPanel/static/dist
          git commit -m "build: rebuild frontend bundle [skip ci]"
          git push
