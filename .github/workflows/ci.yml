name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NsPanel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NsPanel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NsPanel/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n NsPanel/run.sh nspanel.sh && for f in NsPanel/scripts/*.sh NsPanel/scripts/lib/*.sh; do bash -n "$f"; done
      - name: ShellCheck (errors only)
        run: shellcheck -S error NsPanel/run.sh nspanel.sh NsPanel/scripts/*.sh NsPanel/scripts/lib/*.sh
