[project]
name = "nspanel"
version = "0.2.0"
description = "Lightweight browser-based admin panel for a single Ubuntu VPS"
requires-python = ">=3.12"
dependencies = [
    "cloudflare>=5.7.0",
    "fastapi>=0.136.1",
    "psutil>=7.2.2",
    "python-multipart>=0.0.28",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The panel runs from its checkout; packaging only needs the importable trees.
packages = ["core", "features", "modules", "routes"]
py-modules = ["app", "config"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are call-in-default by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Modules are declarative: class attributes shadow the ABC's annotations.
"modules/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
